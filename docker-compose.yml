version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: cphub_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: cphub
      POSTGRES_PASSWORD: cphub_password
      POSTGRES_DB: cphub_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cphub -d cphub_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
