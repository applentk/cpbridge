services:
  - type: web
    name: cpbridge-api
    runtime: go
    region: singapore
    plan: free
    rootDir: apps/api
    buildCommand: go build -o bin/cpbridge-api ./cmd/server && go build -o bin/cpbridge-backfill ./cmd/backfill-problem-snapshots
    startCommand: ./bin/cpbridge-backfill && exec ./bin/cpbridge-api
    healthCheckPath: /api/health
    numInstances: 1
    envVars:
      - key: ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: cpbridge-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: cpbridge-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        value: https://cpbridge.applentk.com
      - key: INITIAL_ADMIN_EMAIL
        sync: false
    domains:
      - api.cpbridge.applentk.com

  - type: keyvalue
    name: cpbridge-redis
    region: singapore
    plan: free
    maxmemoryPolicy: noeviction
    persistenceMode: off
    ipAllowList: []

databases:
  - name: cpbridge-db
    region: singapore
    plan: free
    postgresMajorVersion: "16"
    ipAllowList: []
